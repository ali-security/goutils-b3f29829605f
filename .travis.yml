language: go

go:
  - 1.6.4
  - 1.7.6
  - 1.8.7
  - 1.11

# stdlib-only package: the default `go get -t ./...` install step fails on
# Travis' focal image (checkout lives outside GOPATH for Go < 1.11), so compile
# the package instead.
install:
  - go build -v

script:
  - go test -v

notifications:
  webhooks:
    urls:
      - https://webhooks.gitter.im/e/06e3328629952dabe3e0
    on_success: change  # options: [always|never|change] default: always
    on_failure: always  # options: [always|never|change] default: always
    on_start: never     # options: [always|never|change] default: always
